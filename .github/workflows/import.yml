name: Import verified China Lite v1.0.0
on:
  push:
    paths: ['.github/workflows/import.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKILL: jdads-skill-lite
      SLUG: jdads
      EXPECTED_REPO: ckolpeter/JdAds-Skill-Lite
      EXPECTED_MANIFEST: e8a5a64d9274d1b029e86cdc75a97ebe8abe9d275f796be0e10e70a45b7933e6
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: ckolpeter/SpeAds-Skill-Lite
          ref: 45bfbd5444e3d062a6bf062bf6d3d3ad0050b741
          path: _baseline
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ckolpeter/JdAds-Skill-Lite
          ref: c54889527b3954a2cfd9f98d5d5b16cf7e68dc45
          path: _builder
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Reproduce and verify reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          python _builder/.setup/builder.py --base _baseline --out "$RUNNER_TEMP/china-built" --slug "$SLUG"
          cd "$RUNNER_TEMP/china-built/$SKILL"
          echo "$EXPECTED_MANIFEST  MANIFEST.sha256" | sha256sum --check --strict
          python -m unittest discover -s tests -v
          python scripts/release_gate.py
      - name: Import source without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, shutil, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed = {'.github/workflows/import.yml'}
          if os.environ['SLUG'] == 'jdads':
              allowed.update('.setup/'+n for n in ['builder.py','china.py','profiles.json','test_china.py'])
              allowed.update('.import/part%02d.b64'%i for i in range(1,7))
          unexpected = set(filter(None, tracked)) - allowed
          if unexpected:
              raise SystemExit('Existing non-bootstrap files; abort: '+repr(sorted(unexpected)))
          src = Path(os.environ['RUNNER_TEMP'])/'china-built'/os.environ['SKILL']
          manifest = (src/'MANIFEST.sha256').read_bytes()
          if hashlib.sha256(manifest).hexdigest() != os.environ['EXPECTED_MANIFEST']:
              raise SystemExit('Reviewed manifest mismatch')
          for line in manifest.decode().splitlines():
              expected, rel = line.split('  ',1)
              p = PurePosixPath(rel)
              if p.is_absolute() or '..' in p.parts or (src/rel).is_symlink():
                  raise SystemExit('Unsafe release path')
              if hashlib.sha256((src/rel).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Changed release file: '+rel)
              if rel.startswith('.github/workflows/'):
                  continue
              dest = root/rel
              if dest.exists():
                  raise SystemExit('Refusing overwrite: '+rel)
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src/rel,dest)
          shutil.copyfile(src/'MANIFEST.sha256',root/'MANIFEST.sha256')
          for name in ['_baseline','_builder','.setup','.import']:
              if (root/name).is_dir():
                  shutil.rmtree(root/name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish verified China Ads Lite v1.0.0 source'
          git push origin HEAD:main
